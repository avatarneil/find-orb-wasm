name: Regression data and harness

on:
  push:
    branches: [main, research/short-arc-accuracy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Replay frozen catalog and Horizons data without API access
        run: npm run regression:validate
      - name: Test regression gates and deterministic measurement generation
        run: npm run test:regression
      - name: Test short-arc numerical postprocessing
        run: node --test experiments/short-arcs/methods.test.mjs
      - name: Require byte-identical generated fixtures
        run: git diff --exit-code -- experiments/regression-corpus

# This job checks offline evidence and harness behavior. Native/WASM solver
# comparisons are separate runs requiring the pinned compiled engine artifacts.
